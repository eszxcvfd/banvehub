# Lát cắt Catalog của KienTaoHub — bảng thật cho taxonomy và sản phẩm.
#
# Authority: PLAN.md §17 (danh sách bảng), §26 (P0), §22 (authorization matrix),
#   FR-02/FR-03/FR-05/FR-06/FR-26/FR-27/FR-30, §14.1 (URL), §6.2 (tiền là integer);
#   docs/decisions/0002 (mọi bảng khai AccessGroups + Permission khác 0);
#   docs/decisions/0005 (daptin là backend; bảng tiền chỉ ghi qua action).
#
# Quy ước quyền (bitmask: Peek=1, Read=2, Create=4, Update=8, Delete=16, Execute=32, Refer=64):
#   Permission        = cổng cấp bảng (world row)
#   DefaultPermission = quyền của row mới tạo
#   AccessGroups      = quyền của group trên cổng cấp bảng
# KHÔNG dùng Permission: 0 — schema sync coi là chưa đặt và rơi vào default
# toàn quyền 2097151 (đã kiểm chứng, xem docs/decisions/0002).
#
# Nạp: docker compose restart daptin   (schema cần HARD restart)

Tables:
  # FR-02 — cây danh mục nhiều cấp, là bề mặt SEO chính (§14.1 /ban-ve/nha-pho/)
  - TableName: categories
    IsTopLevel: true
    TableDescription: "Cây danh mục bán vẽ/tài liệu (PLAN.md FR-02)"
    DefaultOrder: "sort_order"
    # Cổng bảng: Guest Peek + Read. Taxonomy là công khai (§5.1 Guest xem category).
    Permission: 3
    # Row mới: mọi người đọc được, chỉ admin ghi (§12.4 Category/Taxonomy thuộc admin CMS)
    DefaultPermission: 3
    AccessGroups:
      - Name: users
        Permission: 49152 # GroupPeek + GroupRead
    Columns:
      - Name: name
        ColumnType: label
        DataType: varchar(200)
        IsNullable: false
      - Name: slug
        ColumnType: alias
        DataType: varchar(200)
        IsNullable: false
        IsUnique: true
        IsIndexed: true
      - Name: description
        ColumnType: content
        DataType: text
      - Name: icon
        ColumnType: label
        DataType: varchar(100)
      - Name: thumbnail
        ColumnType: image
        DataType: text
      - Name: seo_title
        ColumnType: label
        DataType: varchar(200)
      - Name: seo_description
        ColumnType: content
        DataType: text
      - Name: canonical
        ColumnType: url
        DataType: varchar(500)
      - Name: status
        ColumnType: label
        DataType: varchar(50)
      - Name: sort_order
        ColumnType: measurement
        DataType: int
        DefaultValue: "0"

  # FR-03 — taxonomy phần mềm, cho filter theo AutoCAD/Revit/SketchUp...
  - TableName: software_types
    IsTopLevel: true
    TableDescription: "Loại file / phần mềm (PLAN.md FR-03)"
    DefaultOrder: "sort_order"
    Permission: 3
    DefaultPermission: 3
    AccessGroups:
      - Name: users
        Permission: 49152
    Columns:
      - Name: name
        ColumnType: label
        DataType: varchar(200)
        IsNullable: false
      - Name: slug
        ColumnType: alias
        DataType: varchar(200)
        IsNullable: false
        IsUnique: true
        IsIndexed: true
      - Name: status
        ColumnType: label
        DataType: varchar(50)
      - Name: sort_order
        ColumnType: measurement
        DataType: int
        DefaultValue: "0"

  # Tag tự do; quan hệ many-to-many với products do daptin tự tạo join table
  # (Relations ở cuối file). PLAN.md §17 gọi bảng này là product_tags — xem ghi chú
  # trong docs/plans/active/kientaohub-phase-0.md về việc dùng join table của daptin.
  - TableName: tags
    IsTopLevel: true
    TableDescription: "Tag sản phẩm (PLAN.md §17)"
    Permission: 3
    DefaultPermission: 3
    AccessGroups:
      - Name: users
        Permission: 49152
    Columns:
      - Name: name
        ColumnType: label
        DataType: varchar(200)
        IsNullable: false
      - Name: slug
        ColumnType: alias
        DataType: varchar(200)
        IsNullable: false
        IsUnique: true
        IsIndexed: true

  # FR-26 — sản phẩm số. Đây là bảng trung tâm của catalog.
  - TableName: products
    IsTopLevel: true
    TableDescription: "Digital product / listing (PLAN.md FR-26)"
    DefaultOrder: "-created_at"
    # Cổng bảng: Guest Peek + Read. Bản nháp KHÔNG lộ vì quyền row không có bit guest;
    # quyền đọc cho guest của bản đã publish sẽ do luồng publish cấp ở cấp row.
    # CHƯA xây luồng đó — xem "còn mở" trong plan.
    Permission: 3
    # Row mới: owner (seller) Read+Update+Refer; group users Read. Không bit guest,
    # không Delete — BR-08 cấm hard-delete sản phẩm đã có giao dịch.
    DefaultPermission: 42240 # 74<<7 (owner) | 2<<14 (group read)
    AccessGroups:
      - Name: users
        Permission: 49152 # GroupPeek + GroupRead
    Columns:
      - Name: title
        ColumnType: label
        DataType: varchar(300)
        IsNullable: false
      - Name: slug
        ColumnType: alias
        DataType: varchar(300)
        IsNullable: false
        IsUnique: true
        IsIndexed: true
      - Name: product_code
        ColumnType: alias
        DataType: varchar(100)
        IsUnique: true
        IsIndexed: true
      - Name: short_description
        ColumnType: label
        DataType: varchar(500)
      - Name: description
        ColumnType: content
        DataType: text
      - Name: software_version
        ColumnType: label
        DataType: varchar(100)
      # Tiền là integer VND (PLAN.md §6.2). 199000 = 199.000 VND.
      - Name: original_price
        ColumnType: measurement
        DataType: int
        DefaultValue: "0"
      - Name: sale_price
        ColumnType: measurement
        DataType: int
        DefaultValue: "0"
      - Name: is_free
        ColumnType: truefalse
        DataType: boolean
        DefaultValue: "false"
      # FR-28 — trạng thái kiểm duyệt. State machine (smd) chưa khai ở lát cắt này.
      - Name: status
        ColumnType: label
        DataType: varchar(50)
      - Name: file_size
        ColumnType: measurement
        DataType: int
        DefaultValue: "0"
      - Name: notes
        ColumnType: content
        DataType: text
      - Name: copyright_declared
        ColumnType: truefalse
        DataType: boolean
        DefaultValue: "false"
      - Name: cover
        ColumnType: image
        DataType: text
      - Name: view_count
        ColumnType: measurement
        DataType: int
        DefaultValue: "0"
      - Name: download_count
        ColumnType: measurement
        DataType: int
        DefaultValue: "0"
      - Name: rating_avg
        ColumnType: rating
        DataType: int
        DefaultValue: "0"
      - Name: published_at
        ColumnType: datetime
        DataType: timestamp
      - Name: seo_title
        ColumnType: label
        DataType: varchar(300)
      - Name: seo_description
        ColumnType: content
        DataType: text
      - Name: canonical
        ColumnType: url
        DataType: varchar(500)

  # FR-27 / FR-30 — file gốc. KHÔNG khai cột asset ở đây: PLAN.md §42.11 cấm lưu file
  # lớn trong database, còn cloud store của daptin cần credential + cloud_store
  # (chưa chọn nhà cung cấp). Vì vậy lát cắt này giữ metadata + storage key;
  # việc gắn cột asset là một quyết định riêng.
  - TableName: product_files
    IsTopLevel: false
    TableDescription: "File gốc của sản phẩm (PLAN.md FR-27, BR-06 private)"
    # Cổng bảng: Guest Peek là mức thấp nhất khác 0. Không Read, không ghi.
    Permission: 1
    # Row: chỉ owner. Không group, không guest — BR-06 và §42.1.
    DefaultPermission: 9472 # 74<<7
    AccessGroups:
      - Name: users
        Permission: 16384 # GroupPeek only — không đọc được nội dung
    Columns:
      - Name: name
        ColumnType: label
        DataType: varchar(300)
        IsNullable: false
      - Name: file_version
        ColumnType: label
        DataType: varchar(50)
      - Name: checksum
        ColumnType: label
        DataType: varchar(128)
        IsIndexed: true
      - Name: size_bytes
        ColumnType: measurement
        DataType: int
        DefaultValue: "0"
      # UPLOADING | PROCESSING | READY | FAILED | QUARANTINED (FR-27)
      - Name: status
        ColumnType: label
        DataType: varchar(50)
      - Name: storage_key
        ColumnType: label
        DataType: varchar(500)
        IsIndexed: true
      - Name: scan_result
        ColumnType: label
        DataType: varchar(200)
      - Name: changelog
        ColumnType: content
        DataType: text

  # FR-06 — ảnh cover/gallery/preview PDF. Dùng cột image của daptin vì
  # /asset/{table}/{id}/{column} kiểm quyền theo bảng + row trước khi trả file,
  # và hỗ trợ transform ảnh qua processImage=true (resize/thumbnail/WebP).
  - TableName: product_previews
    IsTopLevel: false
    TableDescription: "Preview của sản phẩm (PLAN.md FR-06)"
    DefaultOrder: "sort_order"
    Permission: 3
    # Row: owner Read+Update+Refer, group users Read. Guest chỉ đọc được preview của
    # sản phẩm đã publish — cùng cơ chế cấp quyền row như products (chưa xây).
    DefaultPermission: 42240 # 74<<7 | 2<<14
    AccessGroups:
      - Name: users
        Permission: 49152
    Columns:
      - Name: name
        ColumnType: label
        DataType: varchar(300)
      # cover | gallery | pdf
      - Name: kind
        ColumnType: label
        DataType: varchar(50)
      - Name: image
        ColumnType: image
        DataType: text
      - Name: watermarked
        ColumnType: truefalse
        DataType: boolean
        DefaultValue: "false"
      - Name: sort_order
        ColumnType: measurement
        DataType: int
        DefaultValue: "0"

# Quan hệ khai ở cấp cao nhất — đây là chỗ parser thật sự đọc
# (server/config.go:31,156; examples/payment-checkout/schemas/schema_payment_checkout.yaml:76)
Relations:
  # Cây danh mục: mỗi danh mục trỏ tới danh mục cha (FR-02 "parent")
  - Subject: categories
    Object: categories
    Relation: belongs_to
    ObjectName: parent_id

  # Sản phẩm thuộc một danh mục và một loại phần mềm (FR-05, FR-26)
  - Subject: products
    Object: categories
    Relation: belongs_to
    ObjectName: category_id
  - Subject: products
    Object: software_types
    Relation: belongs_to
    ObjectName: software_id

  # Tag nhiều-nhiều; daptin tự tạo join table
  # product_product_id_has_tag_tag_id, không cần bảng product_tags thủ công
  - Subject: products
    Object: tags
    Relation: has_many_and_belongs_to_many

  # File và preview thuộc một sản phẩm
  - Subject: product_files
    Object: products
    Relation: belongs_to
    ObjectName: product_id
    OnDelete: cascade
  - Subject: product_previews
    Object: products
    Relation: belongs_to
    ObjectName: product_id
    OnDelete: cascade
