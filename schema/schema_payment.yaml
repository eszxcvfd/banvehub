# KienTaoHub payment tables — intents, attempts, webhook events (decisions 0008/0009).
# Authority: PLAN.md §11.1 (PLAN.md:1466-1494), §11.2 (PLAN.md:1513-1523), §21;
#   docs/decisions/0002 (AccessGroups + non-zero Permission; never 0);
#   docs/decisions/0006 extension rule (schema + FinancialWriteDeniedTables +
#     trigger entry in ONE commit — the other two thirds are in
#     daptin/server/resource/financial_guard.go, same package commit).
# Bitmask: Peek=1 Read=2 (table gates mirror wallet_ledger: Guest Peek only;
#   rows owner Peek+Read; no world bits; never an action subject so no Execute).
# Rules honored: no quoted-string DefaultValue (schema/README.md); money
#   columns bigint integer-VND (PLAN.md §6.2, §42.2); status values set by the
#   Phase 1 $payment action, never by column defaults.
# Honesty: payment_intent linkage is owned by the Phase 1 $payment action
#   (no live primitive today — decision 0009 ⛳); payment_webhook_events
#   columns are this package's minimal declaration (PLAN.md names the entity
#   only, PLAN.md:2272); nothing here is proven capability until the action
#   exists and the probes run.
Tables:
  - TableName: payment_intents
    IsTopLevel: true
    TableDescription: "Top-up intent (PLAN.md §11.1, FR-12). Carries the §11.2 lifecycle status. Writes only via the Phase 1 $payment performer."
    Permission: 1
    DefaultPermission: 384
    AccessGroups:
      - Name: users
        Permission: 16384     # GroupPeek only — intents are not group-readable.
    Columns:
      - Name: code
        ColumnType: label
        DataType: varchar(100)
        IsNullable: false
        IsUnique: true
        IsIndexed: true
      - Name: provider
        ColumnType: label
        DataType: varchar(50)
        IsNullable: false
      - Name: amount
        ColumnType: measurement
        DataType: bigint      # integer VND (PLAN.md §6.2); >0 enforced by the action, not here
        IsNullable: false
      - Name: currency
        ColumnType: label
        DataType: varchar(10)
        IsNullable: false
      - Name: status
        ColumnType: label
        DataType: varchar(50) # §11.2 enum, set by the action; never a quoted-string DefaultValue
        IsNullable: false
      - Name: expires_at
        ColumnType: datetime
        DataType: timestamp with time zone
        IsNullable: true
    IsAuditEnabled: true      # secondary evidence only; not enforcement

  - TableName: payment_transactions
    IsTopLevel: true
    TableDescription: "Per-attempt payment record (PLAN.md §11.1). BR-02 idempotency is the unique index on (provider, provider_transaction_id). Writes only via the Phase 1 $payment performer."
    Permission: 1
    DefaultPermission: 384
    CompositeKeys:
      - [provider, provider_transaction_id]
    AccessGroups:
      - Name: users
        Permission: 16384
    Columns:
      - Name: payment_intent_id
        ColumnType: measurement
        DataType: bigint      # daptin-internal id of the payment_intents row; linkage owned by the $payment action
        IsNullable: true
      - Name: payment_intent_code
        ColumnType: label
        DataType: varchar(100)
        IsNullable: true
      - Name: provider
        ColumnType: label
        DataType: varchar(50)
        IsNullable: false
      - Name: provider_transaction_id
        ColumnType: label
        DataType: varchar(200)
        IsNullable: false
      - Name: amount
        ColumnType: measurement
        DataType: bigint
        IsNullable: false
      - Name: raw_reference
        ColumnType: content
        DataType: text        # masked provider reference; full-payload logging stays masked per §11.3
        IsNullable: true
      - Name: status
        ColumnType: label
        DataType: varchar(50) # per-attempt status (§11.2 set); set by the action
        IsNullable: false
      - Name: paid_at
        ColumnType: datetime
        DataType: timestamp with time zone
        IsNullable: true
    IsAuditEnabled: true

  - TableName: payment_webhook_events
    IsTopLevel: true
    TableDescription: "Raw inbound webhook record (PLAN.md §17 entity; columns minimal by this package). Writes only via the Phase 1 $payment performer."
    Permission: 1
    DefaultPermission: 384
    AccessGroups:
      - Name: users
        Permission: 16384
    Columns:
      - Name: provider
        ColumnType: label
        DataType: varchar(50)
        IsNullable: false
      - Name: provider_transaction_id
        ColumnType: label
        DataType: varchar(200)
        IsNullable: true
      - Name: payment_intent_code
        ColumnType: label
        DataType: varchar(100)
        IsNullable: true
      - Name: outcome
        ColumnType: label
        DataType: varchar(50) # accepted | rejected_signature | amount_mismatch | duplicate_replay | error
        IsNullable: false
      - Name: payload_ref
        ColumnType: content
        DataType: text        # masked payload pointer; never full sensitive payload (§33.8, PLAN.md:3116)
        IsNullable: true
    IsAuditEnabled: true
